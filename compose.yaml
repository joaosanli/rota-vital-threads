services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rotavital}
      POSTGRES_USER: ${DB_USER:-rotavital}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copie .env.example para .env e defina DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - interna

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-rotavital}
      DB_USER: ${DB_USER:-rotavital}
      DB_PASSWORD: ${DB_PASSWORD:?Copie .env.example para .env e defina DB_PASSWORD}
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - interna

volumes:
  postgres_data:

networks:
  interna:
    driver: bridge
