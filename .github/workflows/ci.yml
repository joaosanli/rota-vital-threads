name: CI e deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  tests:
    name: Testes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rotavital_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_only_ephemeral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d rotavital_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DB_HOST: localhost
      DB_NAME: rotavital_test
      DB_USER: test
      DB_PASSWORD: test_only_ephemeral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash mvnw -B --no-transfer-progress -Pintegration clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
  image:
    name: Imagem
    timeout-minutes: 20
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rota-vital:${{ github.sha }} .
  deploy:
    name: Solicitar deploy
    timeout-minutes: 5
    needs: [tests, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Publicar o commit validado
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Configure RENDER_DEPLOY_HOOK_URL no ambiente production'; exit 1; }
          curl --connect-timeout 15 --max-time 90 --fail --silent --show-error --get "$DEPLOY_HOOK" --data-urlencode "ref=$COMMIT_SHA" --output /tmp/deploy.json
          echo 'Solicitação aceita pelo provedor. Confirme o término no painel Render.'
