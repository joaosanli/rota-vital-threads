spring.application.name=rota-vital-threads
server.port=${PORT:8080}
server.error.include-message=always

# Todos os dados de conexao podem ser informados pelo ambiente; nenhuma senha no Git.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rotavital}
spring.datasource.username=${DB_USER:rotavital}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=10000

# Executa o schema idempotente ao iniciar; tabelas ficam no volume do PostgreSQL.
spring.sql.init.mode=always

# Actuator avalia tambem a conectividade do DataSource.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
